[package]
name = "now_plexing"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = 'An applet for COSMIC EPOCH for monitoring "Now playing" on your Plex server'
repository = "https://github.com/gnarr/now-plexing"

[build-dependencies]
xdgen = "0.1"

[dependencies]
i18n-embed-fl = "0.10"
rust-embed = "8.11"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
# Only used to reach the desktop notification daemon. Already in the tree via
# libcosmic and cosmic-config, so this adds no compilation.
zbus = { version = "5", features = ["tokio"] }

[dependencies.reqwest]
version = "0.13"
default-features = false
features = ["json", "rustls", "http2"]

[dependencies.i18n-embed]
version = "0.16"
features = ["fluent-system", "desktop-requester"]

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
rev = "1f8d8786940cc6db59d412153c5a03f69a20375c"
# See https://github.com/pop-os/libcosmic/blob/master/Cargo.toml for available features.
features = [
    # Applet support
    "applet",
    "applet-token",
    # Uses cosmic-settings-daemon to watch for config file changes
    "dbus-config",
    # Support creating additional application windows.
    "multi-window",
    # Uses tokio as the executor for the runtime
    "tokio",
    # Add Wayland support to winit
    "wayland",
    # Windowing support for X11, Windows, Mac, & Redox
    "winit",
]

[dev-dependencies]
serde_json = "1"
# Only for the ignored test that sends a real notification; zbus needs a tokio
# runtime to drive it. Already in the tree via reqwest and libcosmic.
tokio = { version = "1", features = ["rt", "net", "time"] }

# Uncomment to test a locally-cloned libcosmic
# [patch.'https://github.com/pop-os/libcosmic']
# libcosmic = { path = "../libcosmic" }
# cosmic-config = { path = "../libcosmic/cosmic-config" }
# cosmic-theme = { path = "../libcosmic/cosmic-theme" }
